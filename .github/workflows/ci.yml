name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # samefact on itself: the reference memory must keep passing.
      - run: node bin/samefact.mjs samefact-memory mcp-server-memory --quick --min direct=0.9
